{% extends 'base.html' %}
{% block title %}أضف خدمتك — BuildLink{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="text-center mb-4">
                <h2 class="section-title">أضف <span>خدمتك</span></h2>
                <div class="gold-divider mx-auto"></div>
                <p style="color:var(--gray);">سجّل خدمتك وابدأ في استقبال العملاء</p>
            </div>

            <div style="background:#fff;border-radius:20px;padding:36px;border:0.5px solid #dde3eb;">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <!-- المعلومات الأساسية -->
                    <div style="background:var(--light-bg);border-radius:12px;padding:20px;margin-bottom:24px;">
                        <h6 style="font-weight:700;color:var(--navy);margin-bottom:16px;">
                            <i class="fas fa-info-circle me-2" style="color:var(--gold);"></i>
                            المعلومات الأساسية
                        </h6>
                        <div class="mb-3">
                            <label class="form-label fw-bold">اسم الشركة / المقاول *</label>
                            <input type="text" name="name" class="form-control" required
                                   placeholder="مثال: شركة النور للتشطيبات">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">التصنيف *</label>
                            <select name="category" class="form-select" required>
                                <option value="">اختر التصنيف</option>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">وصف الخدمة *</label>
                            <textarea name="description" class="form-control" rows="4" required
                                      placeholder="اكتب وصفاً تفصيلياً لخدماتك وأعمالك..."></textarea>
                        </div>
                    </div>

                    <!-- الموقع والتواصل -->
                    <div style="background:var(--light-bg);border-radius:12px;padding:20px;margin-bottom:24px;">
                        <h6 style="font-weight:700;color:var(--navy);margin-bottom:16px;">
                            <i class="fas fa-map-marker-alt me-2" style="color:var(--gold);"></i>
                            الموقع والتواصل
                        </h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">المدينة *</label>
                                <input type="text" name="city" class="form-control" required
                                       placeholder="القاهرة">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">العنوان</label>
                                <input type="text" name="address" class="form-control"
                                       placeholder="العنوان التفصيلي">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">رقم الهاتف *</label>
                                <input type="text" name="phone" class="form-control" required
                                       placeholder="01000000000">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">واتساب</label>
                                <input type="text" name="whatsapp" class="form-control"
                                       placeholder="01000000000">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">البريد الإلكتروني</label>
                                <input type="email" name="email" class="form-control"
                                       placeholder="example@email.com">
                            </div>
                        </div>
                    </div>

                    <!-- التفاصيل -->
                    <div style="background:var(--light-bg);border-radius:12px;padding:20px;margin-bottom:24px;">
                        <h6 style="font-weight:700;color:var(--navy);margin-bottom:16px;">
                            <i class="fas fa-dollar-sign me-2" style="color:var(--gold);"></i>
                            الأسعار والخبرة
                        </h6>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">أقل سعر (جنيه)</label>
                                <input type="number" name="min_price" class="form-control"
                                       placeholder="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">أعلى سعر (جنيه)</label>
                                <input type="number" name="max_price" class="form-control"
                                       placeholder="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">سنوات الخبرة</label>
                                <input type="number" name="experience_years" class="form-control"
                                       placeholder="0" min="0">
                            </div>
                        </div>
                    </div>

                    <!-- الصور -->
                    <div style="background:var(--light-bg);border-radius:12px;padding:20px;margin-bottom:24px;">
                        <h6 style="font-weight:700;color:var(--navy);margin-bottom:16px;">
                            <i class="fas fa-images me-2" style="color:var(--gold);"></i>
                            صور الأعمال
                        </h6>
                        <div style="border:2px dashed #dde3eb;border-radius:12px;
                                    padding:30px;text-align:center;background:#fff;">
                            <i class="fas fa-cloud-upload-alt fa-3x mb-3" style="color:var(--gold);"></i>
                            <p style="color:var(--gray);margin-bottom:12px;">
                                أضف صور أعمالك السابقة
                            </p>
                            <input type="file" name="images" multiple accept="image/*"
                                   class="form-control" style="max-width:300px;margin:0 auto;">
                        </div>
                    </div>

                    <button type="submit" class="btn-gold w-100 py-3"
                            style="font-size:1.1rem;border-radius:12px;">
                        <i class="fas fa-plus-circle me-2"></i>نشر الخدمة
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
